[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fin-config-calc"
version = "0.1.1"
description = "Excel-configured financial data processing and allocation tools"
requires-python = ">=3.12"
dependencies = [
    "arrow>=1.3",
    "loguru>=0.7",
    "openpyxl>=3.1",
    "polars>=1.0",
    "rich>=14.0",
    "textual>=0.80",
]

[project.scripts]
fin-config-calc = "fin_config_calc.ui.textual_app:main"

[project.optional-dependencies]
build-exe = [
    "pyinstaller>=6.0",
]
dev = [
    "pyright>=1.1",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fin_config_calc"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pyright]
pythonVersion = "3.12"
include = ["src", "tests"]
