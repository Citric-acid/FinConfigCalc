# 构建系统配置：pip 等工具会根据这里的设置生成可安装的 wheel 包。
[build-system]
requires = ["hatchling"] # 构建时需要的工具；它不属于程序运行依赖。
build-backend = "hatchling.build" # 实际负责构建的后端。

# 项目发行信息和程序运行时依赖。
[project]
name = "fin-config-calc" # 安装包名称；命令行安装时使用这个名称。
dynamic = ["version"] # 版本号不在本节填写，由下方 Hatch 配置动态读取。
description = "Excel-configured financial data processing and allocation tools"
requires-python = ">=3.12" # 安装本项目所需的最低 Python 版本。
# 安装本项目时也会安装这些运行依赖；>= 表示允许安装不低于指定版本的版本。
dependencies = [
    "arrow>=1.3",
    "loguru>=0.7",
    "openpyxl>=3.1",
    "polars>=1.0",
    "rich>=14.0",
    "textual>=0.80",
]

# 安装项目后创建命令行入口：运行 fin-config-calc 等同于调用指定模块的 main()。
[project.scripts]
fin-config-calc = "fin_config_calc.ui.textual_app:main"

# 可选依赖组：需要哪组工具时再安装，例如 pip install -e ".[dev]"。
[project.optional-dependencies]
# 构建 Windows EXE 时使用：pip install -e ".[build-exe]"。
build-exe = [
    "pyinstaller>=6.0",
]
# 日常开发、测试和静态检查使用。
dev = [
    "pyright>=1.1",
    "pytest>=8.0",
    "ruff>=0.6",
]

# Hatchling 的 wheel（Python 标准安装包格式）构建配置。
[tool.hatch.build.targets.wheel]
packages = ["src/fin_config_calc"] # 从 src 布局中找到要打包的 Python 包。

# 版本的唯一来源：Hatchling 从这个文件中的 __version__ 读取版本号。
[tool.hatch.version]
path = "src/fin_config_calc/__init__.py"

# pytest 测试配置。
[tool.pytest.ini_options]
pythonpath = ["src"] # 测试时将 src 加入导入路径，无需先安装本项目。
testpaths = ["tests"] # 默认从 tests 目录发现测试。

# Ruff 代码检查与格式化配置。
[tool.ruff]
target-version = "py312" # 按 Python 3.12 的语法规则检查。
line-length = 100 # 代码行宽限制。

# Pyright 静态类型检查配置。
[tool.pyright]
pythonVersion = "3.12" # 按 Python 3.12 解释代码和类型。
include = ["src", "tests"] # 需要检查的源码与测试目录。
venvPath = "." # 虚拟环境的父目录；这里的 . 表示项目根目录。
venv = ".venv" # 虚拟环境目录名；与上项组合后指向项目根目录下的 .venv。
